global:
  certWardenURL: https://example.com
  refreshPeriod: 1w1d1h1m1s
  jobTimeout: 5s
  storePath: /etc/ssl
  logPath: /var/log/log.log
  logLevel: debug
certificates:
  - name: test1
    certAPIToken: &certtoken CertToken
    keyAPIToken: &keytoken KeyToken
    refreshPeriod: &refreshperiod 10s
    kind: privatekey
    permissions: 0123
    storePath: /opt/certs
    filename: test1_privkey.pem
    filenamePrefix: "testsomethingelse" # Will be ignored when filename is defined
    splitKeyAndCert: false # When set to true, default filenames with prefix(if defined) will be used
    onRefreshCmd: &refreshcmd "command"
  - name: test2
    certAPIToken: *certtoken
    keyAPIToken: *keytoken
    refreshPeriod: *refreshperiod
    kind: certificate
    permissions: 0123
    storePath: /opt/certs
    filename: test2_fullchain.pem
    onRefreshCmd: *refreshcmd
  - name: test3
    certAPIToken: *certtoken
    keyAPIToken: *keytoken
    refreshPeriod: *refreshperiod
    kind: privatecertchain
    permissions: 0123
    storePath: /opt/certs
    filenamePrefix: "test3"
    onRefreshCmd: *refreshcmd
  - name: test4
    certAPIToken: *certtoken
    keyAPIToken: *keytoken
    refreshPeriod: *refreshperiod
    kind: pfx
    permissions: 0123
    storePath: /opt/certs
    filenamePrefix: "test4"
    onRefreshCmd: *refreshcmd
  - name: test5
    certAPIToken: *certtoken
    keyAPIToken: *keytoken
    refreshPeriod: *refreshperiod
    kind: privatecert
    permissions: 0123
    storePath: /opt/certs
    filenamePrefix: "test5"
    onRefreshCmd: *refreshcmd
  - name: test6
    certAPIToken: *certtoken
    keyAPIToken: *keytoken
    refreshPeriod: *refreshperiod
    kind: certrootchain
    permissions: 0123
    storePath: /opt/certs
    filenamePrefix: "test6"
    onRefreshCmd: *refreshcmd
  - name: test7
    certAPIToken: *certtoken
    keyAPIToken: *keytoken
    refreshPeriod: *refreshperiod
    kind: privatecertchain
    permissions: 0123
    storePath: /opt/certs
    filename: "lorem ipsum"
    filenamePrefix: "test7"
    splitKeyAndCert: true
    onRefreshCmd: *refreshcmd

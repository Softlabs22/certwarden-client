include:
  - project: softlabs/pipelines/snippets
    ref: master
    file:
      - "review/claude-code-review.yml"

stages:
  - scan
  - review
  - build
  - publish

claude-code-review:
  extends: .claude-code-review-template

variables:
  DEBIAN_FRONTEND: noninteractive
  PACKAGE_NAME: "$CI_PROJECT_NAME"
  PACKAGE_VERSION: "$CI_COMMIT_TAG"

.default_build:
  stage: build
  image: 681486450310.dkr.ecr.eu-central-1.amazonaws.com/ci/debuilder:1.0
  script:
    - echo "Building Debian package on $(uname -m)"
    - debuild -uc -us
    - mkdir -p build-artifacts
    - mv ../*.deb build-artifacts/ || true
    - mv ../*.changes build-artifacts/ || true
    - mv ../*.dsc build-artifacts/ || true
    - mv ../*.buildinfo build-artifacts/ || true
  artifacts:
    paths:
      - build-artifacts/*
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

build:amd64:
  extends: .default_build
  tags:
    - docker

build:arm64:
  extends: .default_build
  tags:
    - docker-graviton

publish:
  stage: publish
  image: 681486450310.dkr.ecr.eu-central-1.amazonaws.com/docker-hub/library/alpine:latest
  tags:
    - docker-light
  needs:
    - build:amd64
    - build:arm64
  script:
    - apk add --no-cache curl
    - |
      for file in build-artifacts/*.deb; do
        echo "Uploading $file"
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$file" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/$(basename $file)"
      done
  rules:
    - if: $CI_COMMIT_TAG
